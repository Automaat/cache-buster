version: 2

project_name: bilgie

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/bilgie
    binary: bilgie
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: bilgie
    repository:
      owner: Automaat
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    homepage: "https://github.com/smykla-skalski/bilgie"
    description: "Developer cache manager with configurable size limits"
    license: "MIT"
    install: |
      bin.install "bilgie"
    test: |
      system "#{bin}/bilgie --version"

release:
  github:
    owner: smykla-skalski
    name: bilgie
