version: 2

project_name: bilgie

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/bilgie
    binary: bilgie
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: bilgie
    repository:
      owner: smykla-skalski
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_msg_template: "chore(formula): update bilgie to {{ .Tag }}"
    homepage: "https://github.com/smykla-skalski/bilgie"
    description: "Disk-pressure janitor for dev machines running many agents"
    license: "MIT"
    install: |
      bin.install "bilgie"
      generate_completions_from_executable(bin/"bilgie", "completion")
    test: |
      system "#{bin}/bilgie", "--version"
    caveats: |
      To start the background janitor:

        bilgie install-agent

      The first run is a dry-run. Check cache sizes with:

        bilgie status

release:
  github:
    owner: smykla-skalski
    name: bilgie
