name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12.2

  nilaway:
    name: Nilaway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Install nilaway
        run: go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260617211854-01ab7e30fbe0

      - name: Run nilaway
        run: |
          NILAWAY_BASELINE=0
          set +e
          nilaway -include-pkgs="github.com/Automaat/cache-buster" ./... > nilaway.out 2>&1
          NILAWAY_EXIT=$?
          FINDING_COUNT=$(grep -c '^/' nilaway.out)
          set -e
          if [ "$NILAWAY_EXIT" -ne 0 ] && [ "$FINDING_COUNT" -eq 0 ]; then
            echo "::error::Nilaway exited ${NILAWAY_EXIT} with no parseable findings — crash or package-load failure."
            cat nilaway.out >&2
            exit "$NILAWAY_EXIT"
          fi
          {
            echo "### Nilaway findings"
            echo
            if [ "$FINDING_COUNT" -eq 0 ]; then
              echo "_No issues._"
            else
              echo "<details><summary>${FINDING_COUNT} findings (baseline: ${NILAWAY_BASELINE})</summary>"
              echo
              echo '```'
              cat nilaway.out
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FINDING_COUNT" -gt "$NILAWAY_BASELINE" ]; then
            echo "::error::Nilaway: ${FINDING_COUNT} findings exceeds baseline of ${NILAWAY_BASELINE}. Fix new nil-safety regressions before merging."
            exit 1
          fi
          echo "Nilaway: ${FINDING_COUNT}/${NILAWAY_BASELINE} findings — OK"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Check coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Run govulncheck
        run: |
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./... > govulncheck.out 2>&1
          VULN_EXIT=$?
          set -e
          {
            echo "### govulncheck"
            echo
            echo '```'
            cat govulncheck.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$VULN_EXIT" -ne 0 ]; then
            echo "::error::govulncheck found reachable vulnerabilities."
            cat govulncheck.out >&2
            exit "$VULN_EXIT"
          fi
          echo "govulncheck: no reachable vulnerabilities — OK"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"

      - name: Build binary
        run: go build -v -o cache-buster ./cmd/cache-buster

      - name: Verify binary
        run: ./cache-buster --version || ./cache-buster --help
