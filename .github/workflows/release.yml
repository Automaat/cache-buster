name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v0.2.0). Leave empty for auto minor bump"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"

      - name: Determine version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            # Validate format
            if ! echo "$INPUT_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Error: Version must match format v<major>.<minor>.<patch> (e.g., v0.2.0)"
              exit 1
            fi
            # Validate version > latest tag
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              INPUT_NO_V=${INPUT_VERSION#v}
              LATEST_NO_V=${LATEST_TAG#v}
              if [ "$(printf '%s\n' "$INPUT_NO_V" "$LATEST_NO_V" | sort -V | tail -n1)" != "$INPUT_NO_V" ]; then
                echo "Error: Version $INPUT_VERSION must be > $LATEST_TAG"
                exit 1
              fi
            fi
            VERSION="$INPUT_VERSION"
          elif ! git describe --tags --abbrev=0 2>/dev/null; then
            VERSION="v0.1.0"
          else
            LATEST=$(git describe --tags --abbrev=0)
            # v0.1.3 -> v0.2.0 (bump minor, reset patch)
            VERSION=$(echo "$LATEST" | awk -F. '{print $1"."$2+1".0"}')
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Error: Git tag '$VERSION' already exists"
            exit 1
          fi

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Validate Homebrew token
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "Warning: HOMEBREW_TAP_TOKEN secret is not set. Homebrew tap publishing will be skipped."
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
